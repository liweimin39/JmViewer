name: Build Web (Static)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Inspect dist
        run: |
          echo ">>> dist 目录内容:"
          ls -la dist/
          echo ">>> 总大小:"
          du -sh dist/

      # ★ 打包成 zip，方便下载/部署
      - name: Package dist
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NAME="JmViewer-web-${{ github.ref_name }}"
          else
            NAME="JmViewer-web-${GITHUB_SHA::7}"
          fi
          cd dist
          zip -r "../${NAME}.zip" .
          cd ..
          echo "ZIP_NAME=${NAME}" >> $GITHUB_ENV
          ls -lh "${NAME}.zip"

      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: jmviewer-web-dist
          path: ${{ env.ZIP_NAME }}.zip
          retention-days: 30

      # ★ 只有打 tag 时才发 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.ZIP_NAME }}.zip
          generate_release_notes: true
          draft: false
          prerelease: false
