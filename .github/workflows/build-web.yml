name: Build Web (Static)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Inspect dist
        run: |
          echo ">>> dist 目录内容:"
          ls -la dist/
          echo ">>> 总大小:"
          du -sh dist/

      # 只有一层 zip：把 dist/ 的内容压成 dist.zip
      - name: Package dist
        run: |
          cd dist
          zip -r "../dist.zip" .
          cd ..
          ls -lh dist.zip
          echo ">>> zip 内顶层:"
          unzip -l dist.zip | head -20

      # compression-level: 0，避免 zip 被再次压缩嵌套
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v4
        with:
          name: web-dist
          path: dist.zip
          retention-days: 30
          compression-level: 0
