name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main, Beta]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      # 只在 ios/ 完全不存在时才生成
      - name: Ensure iOS platform exists
        run: |
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo ">>> iOS 工程缺失，重新生成"
            rm -rf ios
            npx cap add ios
          else
            echo ">>> 检测到 iOS 工程已存在，跳过生成"
          fi
          ls -la ios/App/

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS (no codesign)
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ]; then
            echo ">>> CocoaPods 模式"
            sudo gem install cocoapods
            pod install
            WORKSPACE_FLAG="-workspace App.xcworkspace"
          else
            echo ">>> SPM 模式（无 Podfile）"
            WORKSPACE_FLAG="-project App.xcodeproj"
          fi

          xcodebuild \
            $WORKSPACE_FLAG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload out
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r "out/JmViewer-ios-unsigned-${GITHUB_SHA::7}.ipa" Payload
          ls -lh out/

      # compression-level: 0，IPA 本身已是 zip，不再二次压缩
      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: jmviewer-ios-ipa-unsigned
          path: out/*.ipa
          retention-days: 30
          compression-level: 0
