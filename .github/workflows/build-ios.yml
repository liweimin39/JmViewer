name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install CocoaPods
        run: |
          sudo gem install cocoapods
          pod --version

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      # ★ 带诊断的 iOS 平台检查
      - name: Ensure iOS platform exists
        run: |
          echo "=== 检查当前 ios 目录 ==="
          if [ -d "ios" ]; then
            ls -la ios/ || true
            if [ -d "ios/App" ]; then
              ls -la ios/App/ || true
            else
              echo "ios/App 目录不存在"
            fi
          else
            echo "ios 目录不存在"
          fi

          echo "=== 检查 capacitor.config ==="
          ls capacitor.config.* 2>/dev/null || echo "找不到 capacitor.config"

          echo "=== 检查 @capacitor/ios 是否已安装 ==="
          npm ls @capacitor/ios || echo "@capacitor/ios 未在 package.json 中"

          echo "=== 判断是否需要重建 ==="
          if [ ! -f "ios/App/Podfile" ]; then
            echo ">>> Podfile 缺失，重新生成 iOS 平台"
            rm -rf ios
            npx cap add ios
          else
            echo ">>> Podfile 已存在，跳过生成"
          fi

          echo "=== 生成后的 ios/App 目录 ==="
          ls -la ios/App/ || echo "重建后仍然没有 ios/App 目录"

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Pod install
        working-directory: ios/App
        run: pod install

      - name: Build iOS (no codesign)
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          zip -r JmViewer-unsigned.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: jmviewer-ios-ipa-unsigned
          path: JmViewer-unsigned.ipa
          retention-days: 30