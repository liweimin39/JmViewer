name: Build iOS IPA (Unsigned)

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write # 创建 GitHub Release 需要

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      # ★ 只在 ios/ 完全不存在时才生成
      - name: Ensure iOS platform exists
        run: |
          if [ ! -d "ios/App/App.xcodeproj" ]; then
            echo ">>> iOS 工程缺失，重新生成"
            rm -rf ios
            npx cap add ios
          else
            echo ">>> 检测到 iOS 工程已存在，跳过生成"
          fi
          ls -la ios/App/

      - name: Sync Capacitor
        run: npx cap sync ios

      - name: Build iOS (no codesign)
        working-directory: ios/App
        run: |
          if [ -f "Podfile" ]; then
            echo ">>> CocoaPods 模式"
            sudo gem install cocoapods
            pod install
            WORKSPACE_FLAG="-workspace App.xcworkspace"
          else
            echo ">>> SPM 模式（无 Podfile）"
            WORKSPACE_FLAG="-project App.xcodeproj"
          fi

          xcodebuild \
            $WORKSPACE_FLAG \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            build

      # ★ 根据触发方式命名：tag 用版本号，其他用 commit 短 SHA
      - name: Package IPA
        run: |
          mkdir -p Payload
          cp -R ios/App/build/Build/Products/Release-iphoneos/App.app Payload/
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            NAME="JmViewer-ios-${{ github.ref_name }}-unsigned"
          else
            NAME="JmViewer-ios-unsigned-${GITHUB_SHA::7}"
          fi
          zip -r "${NAME}.ipa" Payload
          echo "IPA_NAME=${NAME}" >> $GITHUB_ENV
          ls -lh "${NAME}.ipa"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: jmviewer-ios-ipa-unsigned
          path: ${{ env.IPA_NAME }}.ipa
          retention-days: 30

      # ★ 只有打 tag 时才发 Release
      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ env.IPA_NAME }}.ipa
          generate_release_notes: true
          draft: false
          prerelease: false
