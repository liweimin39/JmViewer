name: Build Android APK

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      build_type:
        description: '构建类型（release 需配置 keystore secrets）'
        required: true
        default: debug
        type: choice
        options:
          - debug
          - release

permissions:
  contents: write # 创建 GitHub Release 需要

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Install dependencies
        run: npm ci

      - name: Build Web
        run: npm run build

      - name: Sync Capacitor
        run: npx cap sync android

      # ---------- 判断是否为 Release 构建 ----------
      - name: Decide build type
        id: flag
        run: |
          if [[ "${{ github.ref }}" == refs/tags/v* ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          elif [[ "${{ github.event_name }}" == "workflow_dispatch" && "${{ inputs.build_type }}" == "release" ]]; then
            echo "is_release=true" >> $GITHUB_OUTPUT
          else
            echo "is_release=false" >> $GITHUB_OUTPUT
          fi

      # ---------- Debug 构建（默认，开源仓库日常）----------
      - name: Build Debug APK
        if: steps.flag.outputs.is_release == 'false'
        working-directory: android
        run: |
          chmod +x ./gradlew
          ./gradlew assembleDebug

      # ---------- Release 构建（正式发布）----------
      - name: Decode Keystore
        if: steps.flag.outputs.is_release == 'true'
        run: echo "${{ secrets.ANDROID_KEYSTORE_BASE64 }}" | base64 -d > android/app/release.keystore

      - name: Build Release APK
        if: steps.flag.outputs.is_release == 'true'
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          chmod +x ./gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$PWD/app/release.keystore \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      # ---------- 收集产物并统一命名 ----------
      - name: Collect Debug APK
        if: steps.flag.outputs.is_release == 'false'
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/debug/*.apk \
             "out/jmviewer-debug-${GITHUB_SHA::7}.apk"

      - name: Collect Release APK
        if: steps.flag.outputs.is_release == 'true'
        run: |
          mkdir -p out
          cp android/app/build/outputs/apk/release/*.apk \
             "out/jmviewer-release-${{ github.ref_name }}.apk"

      # ---------- 上传 Artifact（两种都上传，方便下载）----------
      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-${{ steps.flag.outputs.is_release == 'true' && 'release' || 'debug' }}
          path: out/*.apk
          retention-days: 30

      # ---------- 正式发布：打 tag 时创建 GitHub Release ----------
      - name: Create GitHub Release
        if: steps.flag.outputs.is_release == 'true' && startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: out/*.apk
          generate_release_notes: true
          draft: false
          prerelease: false
